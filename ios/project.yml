name: Studio
options:
  bundleIdPrefix: com.tomenden
  deploymentTarget:
    iOS: "17.0"
# Local.xcconfig is git-ignored and holds KID_SYNC_CODE (her progress-sync code).
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: Q3VTL5U3XB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Studio:
    type: application
    platform: iOS
    sources: [Studio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomenden.yaelstudio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Studio/Info.plist
      properties:
        CFBundleDisplayName: הסטודיו
        CFBundleDevelopmentRegion: he
        UILaunchScreen:
          UIColorName: LaunchBG
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        KidSyncCode: $(KID_SYNC_CODE)
